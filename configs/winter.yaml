# ==============================================================================
# Harvestella Planting Optimizer Configuration: Winter
# ==============================================================================

current_day: 1
wallet_gold: 20000
max_crop_varieties: null # Optional limit on distinct seed varieties (e.g. 2, 3, or null for unlimited)

# ------------------------------------------------------------------------------
# 1. Farm & Biome Plot Capacities
# Usable plots = Physical plots (farm_level * 49) - Reserved plots
# ------------------------------------------------------------------------------
farm_level: 4         # Renovator level (each level adds 49 plots)
waterside_plots: 0    # Biome frozen/locked in Winter
cave_plots: 0         # Biome locked in Winter

# Reserved plots excluded from optimizer (fruit trees, quest crops, makers)
reserve_plots:
  farm: 0
  waterside: 0
  cave: 0

# ------------------------------------------------------------------------------
# 2. Currently Planted on Farm (Active Batches)
# ------------------------------------------------------------------------------
planted:
  # - { crop: Chilly Plant, day: 1, count: 10 }

# ------------------------------------------------------------------------------
# 3. Store Seed Inventory (Remaining Vendor Stock)
# ------------------------------------------------------------------------------
seed_stock:
  # Lethe
  Lumpotato (Lethe): 99   # +10.0 G/d

  # Argene
  Chilly Plant: 99        # +71.4 G/d
  Argene Cabbage: 99      # +25.0 G/d
  Lumpotato (Argene): 99  # +13.3 G/d

# ------------------------------------------------------------------------------
# 4. Town Story Progression (set to false if vendor is not yet unlocked)
# ------------------------------------------------------------------------------
unlocked_towns:
  Lethe: true
  Nemea: true
  Shatolla: true
  Argene: true
  Abandoned Eden: false
